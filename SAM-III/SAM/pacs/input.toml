## basic
max_cycle = 200
n_replica = 64
n_parallel = 1
centering = true
centering_selection = "resid 0 to 52"
working_dir = "/gs/bs/tga-KitaoLab-NexusYtec/yilan/projects/SAM/SAM/test_trial/pacs"

## simulator
simulator = "gromacs"                               # Simulator used inside PaCS-MD
cmd_mpi = ""                          # Commands for MPI such as mpirun, blank is OK
cmd_serial = "gmx_mpi mdrun"               # Commands to run the simulator serially
cmd_parallel = "gmx_mpi mdrun"             # Commands to run the simulator parallelly
structure = "../6_cmd-1/cmd5_center.gro" # Structural file such as gro, pdb, rst7, etc.
topology = "../2_md-preparation/gleap.top"          # Topology file such as top, parm7, psf, etc.
mdconf = "./pacs.mdp"                           # Parameter file such as mdp, mdin, namd, etc.
index_file = "../2_md-preparation/gleap.ndx"        # Gromacs index file
trajectory_extension = ".xtc"                       # Trajectory file extension. ("." is necessary)

## analyzer
type = "rmsddissociation"
threshold = 5
skip_frame = 1
analyzer = "mdtraj"
reference = "../6_cmd-1/cmd5_center.gro"
selection1 = "resid 0 to 51"
selection2 = "resid 52"

## postprocess
cmd_gmx = "gmx_mpi"
genrepresent = true
rmmol = true
keep_selection = "not water"
rmfile = false
